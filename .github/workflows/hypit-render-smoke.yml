name: Hypit free local rendering smoke test
on:
  pull_request:
    paths:
      - projects/chip-ad-001/render-smoke.svml
      - projects/chip-ad-001/render-smoke.svrun
      - projects/chip-ad-001/hypit.runtime.json
      - projects/chip-ad-001/recipes.svs
      - .github/workflows/hypit-render-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/chip-ad-001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Hypit and font
        run: |
          npm install -g @hypit/hypit@0.3.2 --no-audit --no-fund
          npm install --no-save @fontsource-variable/inter --no-audit --no-fund
      - name: Install FFmpeg for Hypit local media providers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -2
          ffprobe -version | head -2
      - name: Check source and render plan (no media model)
        run: |
          set -o pipefail
          mkdir -p diagnostics
          hypit check render-smoke.svml 2>&1 | tee diagnostics/render-check.log
          hypit plan render-smoke.svrun 2>&1 | tee diagnostics/render-plan.log
      - name: Prepare local-only Runtime (no generation APIs)
        run: |
          set -o pipefail
          hypit runtime use hypit.runtime.json 2>&1 | tee diagnostics/runtime-select.log
          hypit runtime up 2>&1 | tee diagnostics/runtime-up.log

      - name: Build actual three-second local MP4
        run: |
          set -o pipefail
          hypit build render-smoke.svrun --follow 2>&1 | tee diagnostics/build.log
          BUILD_ID=$(grep -oE 'bld_[0-9]{8}T[0-9]{9}Z_[0-9A-Za-z]+' diagnostics/build.log | tail -1 || true)
          if [ -z "$BUILD_ID" ]; then
            echo "Build may have succeeded but no Build ID found. Inspect logs." >&2
            hypit builds || true
            exit 2
          fi
          echo "$BUILD_ID" | tee diagnostics/build-id.txt
          mkdir -p output
          hypit get "$BUILD_ID" --output final.video --to output/render-smoke.mp4 2>&1 | tee diagnostics/export.log
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,avg_frame_rate -of json output/render-smoke.mp4 | tee diagnostics/ffprobe.json

      - name: Upload rendered MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypit-free-render-mp4
          path: projects/chip-ad-001/output/render-smoke.mp4
          if-no-files-found: warn

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypit-free-render-plan
          path: projects/chip-ad-001/diagnostics
          if-no-files-found: warn
